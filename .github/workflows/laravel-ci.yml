name: Laravel CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  ci:
    name: Tests and Vite build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: siafco

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, mysql, pdo_mysql, sqlite, pdo_sqlite, gd, zip
          coverage: none

      - name: Setup Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-files-${{ runner.os }}-${{ hashFiles('siafco/composer.lock') }}
          restore-keys: |
            composer-files-${{ runner.os }}-

      - name: Cache vendor
        uses: actions/cache@v4
        with:
          path: siafco/vendor
          key: vendor-${{ runner.os }}-php84-${{ hashFiles('siafco/composer.lock') }}
          restore-keys: |
            vendor-${{ runner.os }}-php84-

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          php -r "file_exists('database/database.sqlite') || touch('database/database.sqlite');"
          chmod -R 775 storage bootstrap/cache
        env:
          APP_ENV: testing
          APP_DEBUG: false
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          SIAFCO_SEED_DEMO_DATA: false
          SIAFCO_SEED_SUPPORT_USERS: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: siafco/package-lock.json

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: siafco/node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('siafco/package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-node22-

      - name: Install Node dependencies
        run: npm install

      - name: Build Vite assets
        run: npm run build

      - name: Run tests
        run: php artisan test
        env:
          APP_ENV: testing
          APP_DEBUG: false
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          SIAFCO_SEED_DEMO_DATA: false
          SIAFCO_SEED_SUPPORT_USERS: false

      - name: Upload compiled Vite build
        uses: actions/upload-artifact@v4
        with:
          name: public-build
          path: siafco/public/build
          if-no-files-found: error
          retention-days: 14
