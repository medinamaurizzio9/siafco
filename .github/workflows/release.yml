name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Build production package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: siafco

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, mysql, pdo_mysql, gd, zip
          coverage: none

      - name: Setup Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: release-composer-${{ runner.os }}-${{ hashFiles('siafco/composer.lock') }}
          restore-keys: |
            release-composer-${{ runner.os }}-

      - name: Install production Composer dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: siafco/package-lock.json

      - name: Install Node dependencies
        run: npm install

      - name: Compile Vite assets
        run: npm run build

      - name: Create build artifact archive
        run: |
          cd public
          zip -r ../public-build.zip build

      - name: Create release package
        run: |
          mkdir -p release-package
          rsync -a app bootstrap config database public resources routes storage vendor artisan composer.json composer.lock release-package/
          rm -rf release-package/public/hot
          find release-package/storage -type f ! -name ".gitignore" -delete
          find release-package/bootstrap/cache -type f ! -name ".gitignore" -delete
          cd release-package
          zip -r ../release.zip \
            app \
            bootstrap \
            config \
            database \
            public/build \
            public/index.php \
            resources \
            routes \
            storage \
            vendor \
            artisan \
            composer.json \
            composer.lock

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: siafco-release-package
          path: |
            siafco/public-build.zip
            siafco/release.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_number }}
          name: SIAFCO Release ${{ github.run_number }}
          body: |
            Production package generated from commit ${{ github.sha }}.

            Includes compiled Vite assets in public/build and production Composer dependencies.
          files: |
            siafco/public-build.zip
            siafco/release.zip
